name: Nightly - Framework Compatibility

# Canary that builds this client against the *latest* published SNAPSHOT of the Axoniq Framework
# (io.axoniq.framework) — i.e. the current state of its `main` branch — and, transitively via its
# BOM, the matching Axon Framework (org.axonframework) snapshot.
#
# The latest snapshot version is discovered at run time from the snapshot repository's metadata,
# so this keeps following main as it rolls forward (5.3.0-SNAPSHOT -> 5.4.0-SNAPSHOT -> ...) without
# ever editing this workflow or the poms. `-U` forces Maven to re-resolve the SNAPSHOT each run.
# Posts the result to Slack (both green and red) so a compatibility break surfaces the next day.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      axoniq_framework_version:
        description: "Axoniq Framework version to build against (blank = latest published snapshot)"
        required: false
        default: ""

jobs:
  compatibility:
    name: Build against latest Axon(iq)Framework snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "zulu"
          java-version: 21
          cache: "maven"

      - name: Resolve latest Axoniq Framework snapshot
        id: fw
        run: |
          INPUT="${{ github.event.inputs.axoniq_framework_version }}"
          if [ -n "$INPUT" ]; then
            LATEST="$INPUT"
            echo "Using manually specified Axoniq Framework version: $LATEST"
          else
            META="https://central.sonatype.com/repository/maven-snapshots/io/axoniq/framework/axoniq-framework-bom/maven-metadata.xml"
            # Pick the highest version currently published to the snapshot repo (handles a maintenance
            # line publishing alongside main — sort -V keeps the newest, e.g. 5.4.0-SNAPSHOT over 5.3.x).
            # --proto/--proto-redir '=https' ensures neither the request nor any redirect can fall back to plain HTTP.
            LATEST=$(curl --proto '=https' --proto-redir '=https' -sSfL "$META" | grep -oE '<version>[^<]+</version>' | sed -E 's:</?version>::g' | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              echo "::error::Could not resolve the latest Axoniq Framework snapshot from $META"
              exit 1
            fi
            echo "Latest Axoniq Framework snapshot: $LATEST"
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Test and Build against latest snapshot
        run: >
          ./mvnw -B -U -Dstyle.color=always
          -Daxoniq-framework.version=${{ steps.fw.outputs.version }}
          clean verify

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *console-framework-client* nightly compatibility vs latest Axon(iq)Framework `main` (`${{ steps.fw.outputs.version }}`): *${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
